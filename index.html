<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olugbenga Crown — Portfolio</title>
<link rel="stylesheet" href="styles.css" />
<style>
/* ── HERO ── */
.hero {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  position: relative;
  overflow: hidden;
}
.hero-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8rem 4rem 4rem 5rem;
  position: relative;
  z-index: 2;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: .6rem;
  font-size: 0.75rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 1.5rem;
  opacity: 0;
  animation: fadeUp .8s .2s forwards;
}
.hero-eyebrow::before {
  content: '';
  display: block;
  width: 2rem;
  height: 1px;
  background: var(--gold);
}
.hero-name {
  font-family: 'Playfair Display', serif;
  font-size: clamp(3rem, 6vw, 5.5rem);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 1.5rem;
  opacity: 0;
  animation: fadeUp .8s .35s forwards;
}
.hero-tagline {
  font-size: 1.05rem;
  font-weight: 300;
  line-height: 1.7;
  color: var(--ink-soft);
  max-width: 420px;
  margin-bottom: 2.5rem;
  opacity: 0;
  animation: fadeUp .8s .5s forwards;
}
.hero-ctas {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  opacity: 0;
  animation: fadeUp .8s .65s forwards;
}
.hero-right { position: relative; overflow: hidden; }
.hero-bg-shape {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--cream) 0%, var(--gold-pale) 60%, #e8d5b0 100%);
}
.hero-deco-lines { position: absolute; inset: 0; overflow: hidden; }
.hero-deco-lines svg {
  position: absolute;
  bottom: -20px; right: -20px;
  width: 420px;
  opacity: 0.18;
}
.hero-badge {
  position: absolute;
  bottom: 3.5rem; left: 3rem;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1rem 1.4rem;
  box-shadow: 0 8px 32px var(--shadow);
  opacity: 0;
  animation: fadeUp .8s .9s forwards;
}
.hero-badge-number {
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem;
  font-weight: 800;
  color: var(--gold);
  line-height: 1;
  margin-bottom: .2rem;
}
.hero-badge-label { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.hero-stats {
  position: absolute;
  top: 3rem; right: 3rem;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  opacity: 0;
  animation: fadeUp .8s 1.1s forwards;
}
.hero-stat-item { text-align: right; }
.hero-stat-number {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--rust);
  line-height: 1;
}
.hero-stat-label { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }

/* ── INTRO STRIP ── */
.intro-strip {
  background: var(--ink);
  padding: 3rem 5rem;
  display: flex;
  align-items: center;
  gap: 4rem;
}
.intro-strip-text {
  flex: 1;
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.1rem, 2vw, 1.5rem);
  font-style: italic;
  color: rgba(255,255,255,0.85);
  line-height: 1.5;
}
.intro-strip-text strong { color: var(--gold-light); font-style: normal; }
.intro-strip-link {
  white-space: nowrap;
  color: var(--gold-light);
  font-size: 0.82rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-decoration: none;
  border-bottom: 1px solid rgba(232,185,106,0.4);
  padding-bottom: 2px;
  transition: color .2s, border-color .2s;
}
.intro-strip-link:hover { color: #fff; border-color: rgba(255,255,255,0.6); }

/* ── SERVICES PREVIEW ── */
#services-preview {
  padding: 6rem 5rem;
}
.services-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
  margin-top: 3rem;
}
.service-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2rem;
  transition: box-shadow .3s, transform .3s;
  cursor: default;
}
.service-card:hover { box-shadow: 0 12px 40px var(--shadow); transform: translateY(-4px); }
.service-icon { font-size: 2rem; margin-bottom: 1rem; display: block; }
.service-name {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: .6rem;
}
.service-desc { font-size: 0.875rem; line-height: 1.65; color: var(--ink-soft); margin-bottom: 1.2rem; }
.service-tags { display: flex; flex-wrap: wrap; gap: .4rem; }
.service-tag {
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
  background: var(--gold-pale);
  padding: .25rem .6rem;
  border-radius: 2px;
}
.services-cta { text-align: center; margin-top: 3rem; }

/* ── WORK PREVIEW ── */
#work-preview {
  padding: 6rem 5rem;
  background: var(--cream);
}
.work-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.5rem;
  margin-top: 3rem;
}
.work-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  transition: box-shadow .3s, transform .3s;
  cursor: pointer;
}
.work-card:hover { box-shadow: 0 16px 48px var(--shadow); transform: translateY(-4px); }
.work-thumb {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
}
.work-body { padding: 1.5rem; }
.work-category { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: .5rem; }
.work-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 600; color: var(--ink); margin-bottom: .6rem; line-height: 1.35; }
.work-desc { font-size: 0.85rem; line-height: 1.6; color: var(--ink-soft); margin-bottom: 1rem; }
.work-footer { display: flex; align-items: center; justify-content: space-between; }
.work-year { font-size: 0.78rem; letter-spacing: 0.1em; color: var(--ink-soft); }
.work-arrow { color: var(--gold); font-size: 1.1rem; transition: transform .2s; }
.work-card:hover .work-arrow { transform: translateX(4px); }
.work-cta { text-align: center; margin-top: 3rem; }

/* ── CTA BAND ── */
.cta-band {
  padding: 6rem 5rem;
  background: linear-gradient(135deg, var(--ink) 0%, #2d261e 100%);
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cta-band::before {
  content: 'GC';
  position: absolute;
  font-family: 'Playfair Display', serif;
  font-size: 20rem;
  font-weight: 800;
  color: rgba(200,150,62,0.04);
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  pointer-events: none;
  letter-spacing: -0.05em;
}
.cta-band h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 4vw, 3.5rem);
  font-weight: 800;
  color: #fff;
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin-bottom: 1.2rem;
}
.cta-band h2 em { font-style: italic; color: var(--gold-light); }
.cta-band p { font-size: 1rem; color: rgba(255,255,255,0.6); max-width: 480px; margin: 0 auto 2.5rem; line-height: 1.7; }
.cta-band .btn-primary { margin: 0 auto; }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; }
  .hero-right { display: none; }
  .hero-left { padding: 8rem 1.5rem 4rem; }
  .services-grid { grid-template-columns: 1fr 1fr; }
  .intro-strip { flex-direction: column; padding: 3rem 2rem; gap: 1.5rem; }
  #services-preview, #work-preview, .cta-band { padding: 4rem 1.5rem; }
}
@media (max-width: 600px) {
  .services-grid, .work-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<nav id="mainNav"></nav>

<!-- HERO -->
<section class="hero" id="home">
  <div class="hero-left">
    <div class="hero-eyebrow" id="heroEyebrow"></div>
    <h1 class="hero-name" id="heroName"></h1>
    <p class="hero-tagline" id="heroTagline"></p>
    <div class="hero-ctas" id="heroCtas"></div>
  </div>
  <div class="hero-right">
    <div class="hero-bg-shape"></div>
    <div class="hero-deco-lines">
      <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="200" cy="200" r="190" stroke="#c8963e" stroke-width="1"/>
        <circle cx="200" cy="200" r="140" stroke="#c8963e" stroke-width="1"/>
        <circle cx="200" cy="200" r="90" stroke="#c8963e" stroke-width="1"/>
        <line x1="10" y1="200" x2="390" y2="200" stroke="#c8963e" stroke-width="1"/>
        <line x1="200" y1="10" x2="200" y2="390" stroke="#c8963e" stroke-width="1"/>
        <line x1="55" y1="55" x2="345" y2="345" stroke="#c8963e" stroke-width="0.5"/>
        <line x1="345" y1="55" x2="55" y2="345" stroke="#c8963e" stroke-width="0.5"/>
      </svg>
    </div>
    <div class="hero-badge" id="heroBadge">
      <div class="hero-badge-number" id="heroBadgeNum"></div>
      <div class="hero-badge-label" id="heroBadgeLabel"></div>
    </div>
    <div class="hero-stats" id="heroStats"></div>
  </div>
</section>

<!-- INTRO STRIP -->
<div class="intro-strip">
  <p class="intro-strip-text" id="introText"></p>
  <a href="about.html" class="intro-strip-link">Read Full Bio →</a>
</div>

<!-- SERVICES PREVIEW -->
<section id="services-preview">
  <div class="reveal">
    <div class="section-label">What I Offer</div>
    <h2 class="section-title">Services &amp; <em>Expertise</em></h2>
  </div>
  <div class="services-grid" id="servicesGrid"></div>
  <div class="services-cta reveal">
    <a href="services.html" class="btn-outline">All Services →</a>
  </div>
</section>

<!-- WORK PREVIEW -->
<section id="work-preview">
  <div class="reveal">
    <div class="section-label">Selected Projects</div>
    <h2 class="section-title">Recent <em>Work</em></h2>
  </div>
  <div class="work-grid" id="workGrid"></div>
  <div class="work-cta reveal">
    <a href="work.html" class="btn-outline">View All Projects →</a>
  </div>
</section>

<!-- CTA BAND -->
<section class="cta-band">
  <div class="reveal">
    <h2>Ready to Work <em>Together?</em></h2>
    <p>Whether you need a project manager, executive assistant, or a strategic thinker — let's build something meaningful.</p>
    <a href="contact.html" class="btn-primary">Get in Touch →</a>
  </div>
</section>

<footer id="mainFooter"></footer>

<script src="shared.js"></script>
<script>
injectNav('home');
injectFooter();
initReveal();

const data = getData();
const d = data;

// Hero
document.getElementById('heroEyebrow').textContent = d.hero.eyebrow;
document.getElementById('heroName').innerHTML = d.hero.name;
document.getElementById('heroTagline').textContent = d.hero.tagline;
document.getElementById('heroCtas').innerHTML = `
  <a href="${d.hero.cta_primary_link}" class="btn-primary">${d.hero.cta_primary} →</a>
  <a href="${d.hero.cta_secondary_link}" class="btn-outline">${d.hero.cta_secondary}</a>
`;
document.getElementById('heroBadgeNum').textContent = d.hero.badge_number;
document.getElementById('heroBadgeLabel').textContent = d.hero.badge_label;
document.getElementById('heroStats').innerHTML = `
  <div class="hero-stat-item">
    <div class="hero-stat-number">${d.hero.stat1_number}</div>
    <div class="hero-stat-label">${d.hero.stat1_label}</div>
  </div>
  <div class="hero-stat-item">
    <div class="hero-stat-number">${d.hero.stat2_number}</div>
    <div class="hero-stat-label">${d.hero.stat2_label}</div>
  </div>
`;

// Intro strip
document.getElementById('introText').innerHTML = `I operate at the intersection of <strong>strategy and execution</strong> — turning ambitious ideas into organised, delivered realities.`;

// Services (show first 3)
const sg = document.getElementById('servicesGrid');
d.services.slice(0, 3).forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'service-card reveal';
  card.innerHTML = `
    <span class="service-icon">${s.icon}</span>
    <div class="service-name">${s.name}</div>
    <p class="service-desc">${s.desc}</p>
    <div class="service-tags">${s.tags.map(t=>`<span class="service-tag">${t}</span>`).join('')}</div>
  `;
  sg.appendChild(card);
});

// Work (show first 4)
const wg = document.getElementById('workGrid');
d.work.slice(0, 4).forEach(w => {
  const card = document.createElement('div');
  card.className = 'work-card reveal';
  card.onclick = () => location.href = 'work.html';
  card.innerHTML = `
    <div class="work-thumb" style="background:${w.color};">${w.emoji}</div>
    <div class="work-body">
      <div class="work-category">${w.category}</div>
      <div class="work-title">${w.title}</div>
      <p class="work-desc">${w.desc}</p>
      <div class="work-footer">
        <span class="work-year">${w.year}</span>
        <div class="work-arrow">→</div>
      </div>
    </div>
  `;
  wg.appendChild(card);
});
</script>
</body>
</html>
