<div id="loginOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--ink);z-index:10000;display:flex;align-items:center;justify-content:center;">
  <div class="admin-card" style="width:100%;max-width:350px;text-align:center;">
    <div style="font-size:2rem;margin-bottom:1rem;">🔐</div>
    <h2 style="font-family:'Playfair Display';margin-bottom:1.5rem;color:var(--ink)">Admin Access</h2>
    <div class="form-group">
      <input type="password" id="adminPassword" placeholder="Enter Password" style="text-align:center;" onkeydown="if(event.key==='Enter') attemptLogin()">
    </div>
    <button class="btn-primary" onclick="attemptLogin()" style="width:100%">Unlock Dashboard</button>
    <p id="loginError" style="color:var(--rust);font-size:0.8rem;margin-top:1rem;display:none;">Incorrect password. Try again.</p>
  </div>
</div>

<div class="admin-layout" id="adminContent" style="display:none;"> 
  <div class="panel" id="panel-meta">
    <div class="admin-topbar"><h1>Site <span>Settings</span></h1></div>
    <div class="admin-card">
      <div class="admin-card-title">Global Site Info & Branding</div>
      
      <div class="form-group" style="margin-bottom: 2rem; padding: 1rem; border: 1px dashed var(--border);">
        <label>Site Logo (Image)</label>
        <div style="display:flex; align-items:center; gap:1.5rem; margin-top:0.5rem;">
          <div id="logoPreview" style="width:60px; height:60px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; background:#fff; overflow:hidden;">
            <small>No Logo</small>
          </div>
          <input type="file" id="logoUpload" accept="image/*" onchange="handleImageUpload(event, 'logo')">
        </div>
        <small style="color:var(--ink-soft); display:block; margin-top:0.5rem;">Recommended: Transparent PNG or SVG.</small>
      </div>

      <div class="form-group"><label>Full Name</label><input type="text" id="m-name" /></div>
      <div class="form-group"><label>Tagline</label><input type="text" id="m-tagline" /></div>
      <div class="form-group"><label>Copyright Year</label><input type="text" id="m-copyright_year" /></div>
    </div>
    <button class="btn-primary" onclick="saveMeta()">Save Settings →</button>
  </div>
</div>

<script>
// 1. AUTHENTICATION LOGIC
const ADMIN_PASS = "admin123"; // CHANGE THIS to your preferred password

function attemptLogin() {
  const pass = document.getElementById('adminPassword').value;
  if(pass === ADMIN_PASS) {
    sessionStorage.setItem('isLoggedIn', 'true');
    checkAuth();
  } else {
    const err = document.getElementById('loginError');
    err.style.display = 'block';
    err.classList.add('shake'); // Optional animation
  }
}

function checkAuth() {
  if(sessionStorage.getItem('isLoggedIn') === 'true') {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('adminContent').style.display = 'grid';
    loadPanel('overview');
  }
}

// Run auth check on page load
window.onload = checkAuth;

// 2. IMAGE HANDLING LOGIC (Logo & Pictures)
let tempLogoBase64 = null;

function handleImageUpload(event, type) {
  const file = event.target.files[0];
  const reader = new FileReader();
  
  reader.onload = function(e) {
    const base64String = e.target.result;
    if(type === 'logo') {
      tempLogoBase64 = base64String;
      document.getElementById('logoPreview').innerHTML = `<img src="${base64String}" style="width:100%;height:100%;object-fit:contain;">`;
    }
    showToast("Image processed. Click 'Save' to apply changes.");
  };
  reader.readAsDataURL(file);
}

// 3. UPDATED SAVE META FUNCTION
async function saveHero() {
  // 1. Get the current data from Supabase first
  const d = await getSupabaseData(); 
  
  // 2. Update the local variable with the form values
  d.hero.name = document.getElementById('h-name').value;
  
  // 3. Send it back to Supabase and wait for confirmation
  await saveSupabaseData(d); 
  
  showToast('Hero section synced to cloud!');
}
  
// ... [Keep your other existing functions like showPanel, saveHero, etc.] ...

// Load existing logo into preview when entering Meta panel
function loadPanel(name) {
  currentData = getData();
  const d = currentData;
  
  // ... [Existing load logic] ...
  
  if (name === 'meta') {
    Object.keys(d.meta).forEach(k => {
      const el = document.getElementById('m-' + k);
      if (el) el.value = d.meta[k];
    });
    if(d.meta.logo) {
      document.getElementById('logoPreview').innerHTML = `<img src="${d.meta.logo}" style="width:100%;height:100%;object-fit:contain;">`;
    }
  }
}
</script>
